<style>
  .short-wrap { margin-top: 22px; display: flex; flex-direction: column; gap: 18px; }
  .short-card { background: var(--surface); border: 1px solid var(--gray-200); border-radius: 16px; overflow: hidden; }
  .short-card .card-title { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--gray-100); }
  .short-card .card-title h2 { margin: 0; font-size: 17px; font-weight: 900; color: var(--dark); }
  .short-list { display: flex; flex-direction: column; gap: 10px; padding: 16px 20px; }
  .short-empty { padding: 34px 20px; text-align: center; color: var(--gray-500); font-weight: 700; font-size: 13.5px; line-height: 1.9; }
  .short-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--gray-50,#f8fafc); border: 1px solid var(--gray-100,#eef2f7); border-radius: 12px; }
  .short-ava { width: 42px; height: 42px; border-radius: 50%; background: var(--primary); color: #fff; display: grid; place-items: center; font-weight: 900; font-size: 15px; flex: none; }
  .short-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .short-info b { font-size: 14px; font-weight: 900; color: var(--dark); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .short-info .sub { font-size: 12.5px; font-weight: 700; color: var(--gray-500); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .short-info .stars { font-size: 12px; color: #fbbf24; }
  .short-actions { display: flex; gap: 8px; align-items: center; flex: none; }
  .short-actions a, .short-actions button { text-decoration: none; font-weight: 800; font-size: 12.5px; border: none; cursor: pointer; padding: 8px 14px; border-radius: 10px; font-family: inherit; }
  .short-view { background: var(--primary); color: #fff; }
  .short-msg { background: var(--gray-200); color: var(--dark); }
  .short-remove { background: transparent; color: var(--rose,#e11d48); }
  .short-compare-box { padding: 16px 20px; border-top: 1px solid var(--gray-100); overflow-x: auto; }
  .short-compare-box table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .short-compare-box th, .short-compare-box td { padding: 9px 12px; text-align: start; white-space: nowrap; border-bottom: 1px solid var(--gray-100); }
  .short-compare-box th { font-weight: 800; color: var(--gray-600); }
  .compare-bar { padding: 14px 20px; border-top: 1px solid var(--gray-100); display: flex; gap: 10px; align-items: center; justify-content: flex-end; }
  .compare-btn { background: var(--primary); color: #fff; border: none; padding: 10px 18px; border-radius: 10px; font-weight: 800; font-size: 13px; cursor: pointer; font-family: inherit; }
  @media (max-width: 640px) {
    .short-actions { flex-direction: column; align-items: stretch; }
  }
</style>
</head>
<body>

<div data-partial="nav.f58844"></div>

<div class="container">
  <div id="trialBanner" style="display:none;"></div>
  <div class="short-wrap">
    <div class="short-card">
      <div class="card-title">
        <h2>⭐ <span data-i18n="nav.shortlist">القائمة المختصرة</span></h2>
        <button class="compare-btn" id="compareBtn" style="display:none;">⚖️ <span data-i18n="clubprofile.compare">مقارنة</span></button>
      </div>
      <div class="short-list" id="shortlistBox">
        <div class="short-empty">⏳ جاري التحميل…</div>
      </div>
      <div class="compare-bar" id="compareBar" style="display:none;">
        <button class="compare-btn" id="compareRun">⚖️ عرض المقارنة</button>
      </div>
      <div class="short-compare-box" id="compareBox" style="display:none;"></div>
    </div>
  </div>
</div>

  <div class="toast" id="toast" style="position:fixed;bottom:24px;right:50%;transform:translateX(50%);background:var(--green);color:#fff;font-weight:800;font-size:13.5px;padding:13px 22px;border-radius:12px;box-shadow:var(--shadow-md);opacity:0;pointer-events:none;transition:opacity .25s;z-index:3000;">تم بنجاح</div>
  <!-- partials.js MUST run BEFORE the page script: it injects the navbar
       markup synchronously, so handlers bound to #logoutBtn actually attach. -->
  <script src="js/partials.js"></script>
  <script src="js/api.js"></script>
  <script src="js/sub-banner.js"></script>
  <script src="js/shortlist.js"></script>
<div data-partial="foot.b25e1b"></div>
