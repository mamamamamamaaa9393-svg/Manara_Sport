<style>
  .ai-wrap { max-width: 760px; margin: 0 auto; }
  .ai-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: var(--shadow-md);
    overflow: hidden;
    display: flex; flex-direction: column;
    height: min(72vh, 640px);
  }
  .ai-head {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 18px; border-bottom: 1px solid var(--line);
    background: linear-gradient(135deg, #0b1220, #15233f);
    color: #fff;
  }
  .ai-head .ai-avatar { font-size: 22px; }
  .ai-head h2 { font-size: 16px; margin: 0; font-weight: 800; }
  .ai-head small { display:block; opacity:.7; font-size:12px; }
  .ai-log {
    flex: 1; overflow-y: auto; padding: 18px;
    display: flex; flex-direction: column; gap: 12px;
    background: var(--bg-soft);
  }
  .ai-msg { max-width: 85%; padding: 11px 14px; border-radius: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .ai-msg.user { align-self: flex-end; background: var(--primary); color: #fff; border-bottom-right-radius: 4px; }
  .ai-msg.bot { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); color: var(--ink); border-bottom-left-radius: 4px; }
  .ai-msg.bot.reject { background: var(--orange-bg); border-color: var(--orange); color: var(--accent-ink); }
  .ai-msg.bot.error { background: var(--primary-soft); border-color: var(--primary); color: var(--primary-ink); }
  .ai-typing span { display:inline-block; width:6px; height:6px; margin:0 2px; border-radius:50%; background:#94a3b8; animation: aiBlink 1s infinite; }
  .ai-typing span:nth-child(2){ animation-delay:.2s } .ai-typing span:nth-child(3){ animation-delay:.4s }
  @keyframes aiBlink { 0%,100%{opacity:.3} 50%{opacity:1} }
  .ai-input { display: flex; gap: 10px; padding: 12px 14px; border-top: 1px solid var(--line); }
  .ai-input textarea {
    flex: 1; resize: none; border-radius: 12px; border: 1px solid var(--line);
    padding: 10px 12px; font-family: inherit; font-size: 15px; background: var(--surface); color: var(--ink);
    max-height: 120px;
  }
  .ai-input textarea:focus { outline: 2px solid var(--primary-glow); border-color: var(--primary); }
  .ai-empty { text-align:center; color: var(--muted); margin:auto; max-width: 420px; }
  .ai-empty .big { font-size: 40px; }
</style>
