<!-- ============================================================ Board -->
<main id="board" class="board">
  <div class="container-x">

<button class="btn btn-outline-ink btn-pill filters-toggle" id="filtersToggle" type="button" aria-expanded="false" aria-controls="filtersPanel">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
      Filters
    </button>

    <div class="search-tabs" id="searchTabs">
      <button class="search-tab active" data-mode="all" data-i18n="search.all">الكل</button>
      <button class="search-tab" data-mode="players" data-i18n="search.players">لاعبون</button>
      <button class="search-tab" data-mode="clubs" data-i18n="search.clubs">أندية</button>
    </div>

    <div class="board-grid">
      <!-- Sidebar filters -->
      <aside class="filters is-collapsed" id="filtersPanel" aria-label="Job filters">
        <div class="filters-head">
          <h2>Filters</h2>
          <button type="button" id="clearFilters">Clear all</button>
        </div>
        <div class="filters-body">
          <!-- keyword -->
          <div class="fgroup">
            <h3>Keyword</h3>
            <label class="field" style="position:relative">
              <svg style="position:absolute;left:12px;top:50%;transform:translateY(-50%)" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#6b7488" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
              <input type="text" id="fKeyword" class="fsearch" style="padding-left:38px" placeholder="Name, position, club">
            </label>
          </div>
          <!-- sport -->
          <div class="fgroup">
            <h3>الرياضة</h3>
            <label class="check"><input type="checkbox" class="f-cat" value="Football"> كرة القدم <span class="cnt">3</span></label>
            <label class="check"><input type="checkbox" class="f-cat" value="Basketball"> كرة السلة <span class="cnt">0</span></label>
            <label class="check is-disabled"><input type="checkbox" class="f-cat" value="Tennis" disabled> تنس <span class="soon-badge sm" data-i18n="cat.soon">قريباً</span></label>
            <label class="check is-disabled"><input type="checkbox" class="f-cat" value="Volleyball" disabled> الكرة الطائرة <span class="soon-badge sm" data-i18n="cat.soon">قريباً</span></label>
            <label class="check is-disabled"><input type="checkbox" class="f-cat" value="Handball" disabled> كرة اليد <span class="soon-badge sm" data-i18n="cat.soon">قريباً</span></label>
            <label class="check is-disabled"><input type="checkbox" class="f-cat" value="Golf" disabled> جولف <span class="soon-badge sm" data-i18n="cat.soon">قريباً</span></label>
            <label class="check is-disabled"><input type="checkbox" class="f-cat" value="Karate" disabled> كاراتيه <span class="soon-badge sm" data-i18n="cat.soon">قريباً</span></label>
            <label class="check is-disabled"><input type="checkbox" class="f-cat" value="Swimming" disabled> سباحة <span class="soon-badge sm" data-i18n="cat.soon">قريباً</span></label>
          </div>
          <!-- position -->
          <div class="fgroup">
            <h3>Position</h3>
            <label class="field" style="position:relative">
              <svg style="position:absolute;left:12px;top:50%;transform:translateY(-50%)" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#6b7488" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
              <input type="text" id="fPosition" class="fsearch" style="padding-left:38px" placeholder="Striker, Goalkeeper, Winger…">
            </label>
          </div>
          <!-- level -->
          <div class="fgroup">
            <h3>Level</h3>
            <select id="fLevel" class="fselect">
              <option value="">All levels</option>
              <option value="international">International</option>
              <option value="pro">Pro</option>
              <option value="semi-pro">Semi-pro</option>
              <option value="amateur">Amateur</option>
              <option value="beginner">Beginner</option>
            </select>
          </div>
          <!-- age -->
          <div class="fgroup">
            <h3>Age</h3>
            <div class="range-pair">
              <input type="number" id="fAgeMin" min="14" max="50" placeholder="Min" class="fnum">
              <span>–</span>
              <input type="number" id="fAgeMax" min="14" max="50" placeholder="Max" class="fnum">
            </div>
          </div>
          <!-- height -->
          <div class="fgroup">
            <h3>Height (cm)</h3>
            <div class="range-pair">
              <input type="number" id="fHeightMin" min="140" max="220" placeholder="Min" class="fnum">
              <span>–</span>
              <input type="number" id="fHeightMax" min="140" max="220" placeholder="Max" class="fnum">
            </div>
          </div>
          <!-- country -->
          <div class="fgroup">
            <h3>Country</h3>
            <label class="field" style="position:relative">
              <svg style="position:absolute;left:12px;top:50%;transform:translateY(-50%)" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#6b7488" stroke-width="2" stroke-linecap="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
              <input type="text" id="fCountry" class="fsearch" style="padding-left:38px" placeholder="Egypt, Portugal…">
            </label>
          </div>
        </div>
      </aside>

      <!-- Results -->
      <div class="board-main">
<div class="result-line">
          <div class="count">Showing <b id="resultCount">0</b> of <b id="totalCount">0</b> <span id="countUnit">نتائج</span></div>
          <div class="board-sort">
            <label for="sortBy">Sort by</label>
            <select id="sortBy">
              <option value="recent">Most recent</option>
              <option value="rating">Most rated</option>
            </select>
          </div>
        </div>

        <div class="job-list" id="jobList"><!-- populated from the live API --></div>

        <div class="no-results" id="noResults">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <h3>No players match those filters</h3>
          <p>Try clearing a sport or changing your keyword to see more athletes.</p>
        </div>
      </div>
    </div>
  </div>
</main>
